<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Multicartera · Acceso privado</title>
<style>
  :root{--ink:#12352d;--muted:#6f807a;--line:#dce7e2;--sand:#f4f7f5;--bg:#123a31;--gold:#f4b740;--warn:#b3261e}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 30% 20%,#1d5546,var(--bg));color:var(--ink);font-family:system-ui,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:18px;width:100%;max-width:400px;padding:34px 30px 24px;text-align:center;box-shadow:0 20px 50px #0004}
  .mark{width:64px;height:64px;border-radius:16px;background:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .mark svg{width:34px;height:34px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em} h2{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
  p{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.5}
  input[type=password]{width:100%;padding:12px 14px;font-size:16px;letter-spacing:.12em;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--sand);color:var(--ink);outline:none;text-transform:uppercase}
  input:focus{border-color:var(--ink)}
  label.rem{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);margin:14px 0 18px;cursor:pointer}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;letter-spacing:.08em;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .err{color:var(--warn);font-size:12.5px;min-height:16px;margin-top:12px}
  .foot{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="mark"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 12h18M10 12v2h4v-2"/></svg></div>
  <h1>Multicartera</h1>
  <h2>Acceso privado</h2>
  <p>Introduce el código de acceso que te ha facilitado Jordi Audet Palau.</p>
  <input id="c" type="password" placeholder="Código de acceso" aria-label="Código de acceso" autofocus>
  <label class="rem"><input type="checkbox" id="r" checked> Recordar en este dispositivo</label>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e"></div>
  <div class="foot">Multicartera · © 2026 Jordi Audet Palau.<br>Todos los derechos reservados. Prohibida su copia, modificación o distribución sin autorización.</div>
</form>
<script>
(function(){
  var CFG = {"salt": "sFabvwO1EmgszkHeKQRAvw==", "iv": "d2tuhge7B9/PTzCE", "it": 310000, "tag": "multicartera", "v": "s0OLAYtR"};
  var LS = 'gate_' + CFG.tag;
  var $ = function(i){ return document.getElementById(i); };
  var b64 = function(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var norm = function(s){ return (s || '').replace(/[\s\-]/g, '').toUpperCase(); };
  var store = { get: function(){ try { return localStorage.getItem(LS); } catch(e){ return null; } }, set: function(v){ try { localStorage.setItem(LS, v); } catch(e){} }, del: function(){ try { localStorage.removeItem(LS); } catch(e){} } };
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream){ $('e').textContent = 'Tu navegador no es compatible. Ábrelo con Chrome, Edge, Safari o Firefox actualizados.'; $('b').disabled = true; return; }
  var datos = fetch('d.bin?v=' + encodeURIComponent(CFG.v), {cache: 'no-cache'}).then(function(r){ if (!r.ok) throw new Error('net'); return r.arrayBuffer(); });
  function abrir(code, recordar){
    $('b').disabled = true; $('e').textContent = ''; $('b').textContent = 'Abriendo…';
    return crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey'])
      .then(function(k){ return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(CFG.salt), iterations: CFG.it, hash: 'SHA-256'}, k, {name: 'AES-GCM', length: 256}, false, ['decrypt']); })
      .then(function(key){ return datos.then(function(ct){ return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(CFG.iv)}, key, ct); }); })
      .then(function(gz){ return new Response(new Response(gz).body.pipeThrough(new DecompressionStream('gzip'))).text(); })
      .then(function(html){ if (recordar) store.set(norm(code)); else store.del(); document.open(); document.write(html); document.close(); })
      .catch(function(err){
        $('b').disabled = false; $('b').textContent = 'Entrar';
        if (err && err.message === 'net'){ $('e').textContent = 'No se ha podido cargar. Comprueba la conexión y vuelve a intentarlo.'; return; }
        store.del(); $('e').textContent = 'Código incorrecto.'; $('c').select();
      });
  }
  $('f').addEventListener('submit', function(ev){ ev.preventDefault(); var v = $('c').value; if (!norm(v)){ $('c').focus(); return; } abrir(v, $('r').checked); });
  var guardado = store.get(); if (guardado) abrir(guardado, true);
})();
</script>
</body>
</html>
